name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      pg_version:
        description: 'PostgreSQL version (e.g. 18.4)'
        required: false
        default: '18.4'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: postgres
      PG_VERSION_FULL: ${{ github.event.inputs.pg_version || '18.4' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve PostgreSQL SHA256
        id: sha
        run: |
          PG_VER="${{ env.PG_VERSION_FULL }}"
          PG_UNDERSCORE="${PG_VER//./_}"
          URL="https://github.com/postgres/postgres/archive/refs/tags/REL_${PG_UNDERSCORE}.tar.gz"
          echo "Downloading $URL ..."
          curl -fSL "$URL" -o /tmp/postgres.tar.gz
          SHA=$(sha256sum /tmp/postgres.tar.gz | awk '{print $1}')
          echo "PG_SHA256=$SHA" >> "$GITHUB_OUTPUT"
          echo "PG_VERSION_UNDERSCORE=$PG_UNDERSCORE" >> "$GITHUB_OUTPUT"
          echo "Resolved SHA256: $SHA"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PG_VERSION=${{ steps.sha.outputs.PG_VERSION_UNDERSCORE }}
            PG_SHA256=${{ steps.sha.outputs.PG_SHA256 }}
            LABEL_VERSION=${{ env.PG_VERSION_FULL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.PG_VERSION_FULL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          readme-filepath: ./README-DOCKER.md
